name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node（js 后端测试需要）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查（警告即失败）
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 单元测试（wasm-gc）
        run: moon test --target wasm-gc

      - name: 单元测试（js）
        run: moon test --target js

      - name: 生成测试映像（应与仓库内一致）
        run: |
          python3 tools/gen_fixtures.py
          git diff --exit-code tools/corpus

      - name: 端到端对拍（CLI 输出）
        run: python3 tools/check_e2e.py

      # 内核 iso9660 驱动读同一份映像，作为独立实现与 CLI 交叉验证。
      # map=off：Linux 默认会把 ISO 名字转成小写，这里保留映像里的原始大小写。
      - name: 内核挂载交叉验证
        run: |
          sudo mkdir -p /mnt/mooniso
          sudo mount -o loop,ro,map=off -t iso9660 tools/corpus/minimal.iso /mnt/mooniso
          python3 tools/check_e2e.py --mount-point /mnt/mooniso
          sudo umount /mnt/mooniso
